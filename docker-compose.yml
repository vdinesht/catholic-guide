services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catholic_guide
      POSTGRES_USER: catholic_guide
      POSTGRES_PASSWORD: catholic_guide
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catholic_guide"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/catholic_guide
      DATABASE_USERNAME: catholic_guide
      DATABASE_PASSWORD: catholic_guide
      APP_SITE_URL: http://localhost:8081
      APP_CORS_ORIGINS: http://localhost:8081
      # Set MAIL_ENABLED=true and the SMTP_* variables to email real sign-in codes.
      MAIL_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
